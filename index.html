<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday | Gửi Yến Ngọc</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="ngoc.css">
</head>
<body>

    <iframe id="youtube-audio" width="0" height="0" src="" frameborder="0" allow="autoplay" style="display:none;"></iframe>

    <canvas id="scene"></canvas>

    <div id="photo-gallery">
        <img src="1.jpg" alt="Yến Ngọc" class="photo-item">
        <img src="2.jpg" alt="Yến Ngọc" class="photo-item">
        <img src="3.jpg" alt="Yến Ngọc" class="photo-item">
        <img src="4.jpg" alt="Yến Ngọc" class="photo-item">
        <img src="5.jpg" alt="Yến Ngọc" class="photo-item">
        <img src="6.jpg" alt="Yến Ngọc" class="photo-item">
    </div>

    <div class="card-container" id="card">
        <h1 id="title">Happy Birthday</h1>
        <div class="name" id="name">Yến Ngọc</div>
        
        <div class="message" id="message">
            "Hôm nay là một ngày đặc biệt. Chúc Ngọc bước sang tuổi 19 thật nhiều niềm vui và bình yên. <br>
            Cứ mãi xinh đẹp, thanh khiết và tỏa sáng theo cách riêng của mình nhé. <br>
            Mọi điều tốt đẹp nhất sẽ đến với cậu!"
        </div>

        <button class="btn" id="openBtn">Mở Lời Chúc</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    
    <script src="ngoc.js"></script>
</body>
</html>
